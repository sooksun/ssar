# SSAR — Docker Compose สำหรับ Ubuntu host
# Path แนะนำบน server: /DATA/AppData/www/ssar
# ใช้ MariaDB ภายนอกที่ 192.168.1.4 (ไม่รัน DB ใน Docker)

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ssar-app
    restart: unless-stopped
    ports:
      - "9954:9954"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "9954"
    volumes:
      # เก็บไฟล์อัปโหลด (evidence, lesson-plans, teaching-media, external-evaluations)
      - ./public/uploads:/app/public/uploads
    # ใช้ /api/health ที่มีอยู่แล้ว (เช็ค DB ด้วย) — restart อัตโนมัติถ้า DB หลุด
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9954/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # ให้ container เข้าถึง MariaDB ที่ 192.168.1.4 ได้ (ใช้ network เดียวกับ host หรือ bridge)
    # ถ้า DB อยู่คนละเครือข่าย ให้ตรวจสอบ firewall / routing
